services:
  redis:
    image: redis:7-alpine
    container_name: taskjobforge_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: taskjobforge_api
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis:6379

  dashboard:
    build:
      context: ./dashboard
    container_name: taskjobforge_dashboard
    ports:
      - "5174:5174"
    depends_on:
      - api
